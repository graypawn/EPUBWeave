name: Build and release EPUBWeave

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run test suite in Docker
        run: |
          docker run --rm \
            -v "$PWD":/app \
            -w /app \
            python:3.12-slim-bookworm \
            sh -c 'pip install --no-cache-dir -r requirements.txt pytest && pytest -q'

  build:
    name: Build ${{ matrix.asset_name }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            asset_name: epubweave-linux-amd64-glibc
          - platform: linux/arm64
            asset_name: epubweave-linux-arm64-glibc
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build and smoke-test standalone binary
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --target artifact \
            --output type=local,dest=dist \
            .
          mv dist/epubweave "dist/${{ matrix.asset_name }}"
          chmod +x "dist/${{ matrix.asset_name }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: epubweave-linux-*-glibc
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum epubweave-* > SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --generate-notes
          fi
