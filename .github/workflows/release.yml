name: Build and release EPUBWeave

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run test suite in Docker
        run: |
          docker run --rm \
            -v "$PWD":/app \
            -w /app \
            python:3.12-slim-bookworm \
            sh -c 'pip install --no-cache-dir -r requirements.txt pytest && pytest -q'

  build:
    name: Build ${{ matrix.asset_name }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            asset_name: epubweave-linux-amd64-glibc
          - platform: linux/arm64
            asset_name: epubweave-linux-arm64-glibc
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build and smoke-test standalone binary
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --target artifact \
            --output type=local,dest=dist \
            .
          mv dist/epubweave "dist/${{ matrix.asset_name }}"
          chmod +x "dist/${{ matrix.asset_name }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag matches package version
        run: |
          package_version="$(python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("main.py").read_text(encoding="utf-8"))
          for node in tree.body:
              if (
                  isinstance(node, ast.Assign)
                  and len(node.targets) == 1
                  and isinstance(node.targets[0], ast.Name)
                  and node.targets[0].id == "PACKAGE_VERSION"
                  and isinstance(node.value, ast.Constant)
                  and isinstance(node.value.value, str)
              ):
                  print(node.value.value)
                  break
          else:
              raise SystemExit("PACKAGE_VERSION must be a string constant in main.py")
          PY
          )"
          test "v${package_version}" = "$GITHUB_REF_NAME"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: epubweave-linux-*-glibc
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum epubweave-* > SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG" release/* --repo "$GH_REPO" --generate-notes
          fi
